name: herd
version: 1.0.2
description: "Keep one Hermes across every machine: settings, skills and memory follow you between devices (API keys too, once you turn that on). Merges config per key so each machine keeps its own Docker path, ports and tokens; secrets are encrypted before they leave; every sync leaves a restorable backup. Works over any folder (git, Dropbox, iCloud, a USB stick)."
author: "Welliv"
kind: standalone
requires_hermes: ">=0.23"
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - sync_status
  - sync_diff
  - sync_now
provides_hooks:
  - on_session_start
  - on_session_end
python_dependencies:
  - "cryptography>=41,<52"
  - "ruamel.yaml>=0.17,<0.19"
