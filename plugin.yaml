name: herd
version: 1.1.1
description: "Two machines, one Hermes — pair with one short code: settings, skills and memory follow you between devices, and API keys follow once you turn that on. Each machine keeps what belongs to it — its Docker path, its ports, its bot tokens — because config is merged per key, not copied. Secrets are encrypted before they leave; every pull can be undone."
author: "Welliv"
homepage: "https://github.com/welliv/hermes-herd"
license: "MIT"
kind: standalone
requires_hermes: ">=0.23"
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - sync_status
  - sync_diff
  - sync_now
provides_hooks:
  - on_session_start
  - on_session_end
python_dependencies:
  - "cryptography>=41,<52"
  - "ruamel.yaml>=0.17,<0.19"
