name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography ruamel.yaml pytest
      - name: Unit + end-to-end tests
        run: python -m pytest tests -q
      - name: Manifests parse
        run: |
          python - <<'PY'
          from ruamel.yaml import YAML
          doc = YAML(typ="safe").load(open("plugin.yaml").read())
          assert doc["name"] == "herd", doc.get("name")
          assert doc["provides_tools"], "no tools declared"
          print("plugin.yaml ok:", doc["name"], doc["version"])
          PY
