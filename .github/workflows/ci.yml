name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The plugin claims macOS and Windows; one interpreter each is enough
          # to catch path, permission and line-ending assumptions.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography ruamel.yaml pytest
      - name: Unit + end-to-end tests
        run: python -m pytest tests -q
      - name: Audit matrix
        run: python audit/matrix.py
      - name: Randomised histories
        run: python audit/fuzz.py 10 7
      - name: Manifests parse
        run: python scripts/check_manifest.py
